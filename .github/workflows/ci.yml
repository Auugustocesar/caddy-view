name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, because new vulnerabilities in the Go standard library show up without any change in this repository.
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  lint:
    name: lint and vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: go mod tidy
        run: go mod tidy -diff

      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@2026.2.2 ./...

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  web:
    name: web UI (tests and committed build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: npm ci
        run: npm ci

      - name: npm test
        run: npm test

      - name: npm audit
        run: npm audit

      - name: npm run build
        run: npm run build

      # The Go binary embeds internal/web/dist, so what is committed must be what the sources build.
      - name: committed build is current
        working-directory: .
        run: |
          git add --intent-to-add internal/web/dist
          git diff --exit-code -- internal/web/dist

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: gofmt
        run: |
          unformatted="$(gofmt -s -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -race -count=1 -shuffle=on ./...
