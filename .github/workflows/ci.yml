name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, because new vulnerabilities in the Go standard library show up without any change in this repository.
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  lint:
    name: lint and vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: go mod tidy
        run: go mod tidy -diff

      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@2026.2.2 ./...

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  integration:
    name: integration (real Caddy)
    runs-on: ubuntu-latest
    env:
      CADDY_VERSION: 2.11.7
      # A missing Caddy binary must fail this job, not skip the tests.
      CADDY_VIEW_REQUIRE_INTEGRATION: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: install Caddy
        run: |
          set -euo pipefail
          base="https://github.com/caddyserver/caddy/releases/download/v${CADDY_VERSION}"
          archive="caddy_${CADDY_VERSION}_linux_amd64.tar.gz"
          curl -fsSLO "${base}/${archive}"
          curl -fsSLO "${base}/caddy_${CADDY_VERSION}_checksums.txt"
          grep " ${archive}\$" "caddy_${CADDY_VERSION}_checksums.txt" | sha512sum -c -
          mkdir "${RUNNER_TEMP}/caddy"
          tar -xzf "${archive}" -C "${RUNNER_TEMP}/caddy" caddy
          echo "CADDY_BIN=${RUNNER_TEMP}/caddy/caddy" >> "${GITHUB_ENV}"

      - name: integration tests
        run: go test -race -tags integration -count=1 ./internal/configmgr

  web:
    name: web UI (tests and committed build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: npm ci
        run: npm ci

      - name: npm test
        run: npm test

      # Production dependencies only: the build tools are not shipped (the built UI is committed), and an advisory
      # in them, such as the deepmerge one in the Svelte Vite plugin, would otherwise block every commit.
      - name: npm audit
        run: npm audit --omit=dev

      - name: npm run build
        run: npm run build

      # The Go binary embeds internal/web/dist, so what is committed must be what the sources build.
      - name: committed build is current
        working-directory: .
        run: |
          git add --intent-to-add internal/web/dist
          git diff --exit-code -- internal/web/dist

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: gofmt
        run: |
          unformatted="$(gofmt -s -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -race -count=1 -shuffle=on ./...
